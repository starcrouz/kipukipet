    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Codystar:wght@400&family=Montserrat:wght@400;700&family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Titillium Web', sans-serif;
        background-color: #000;
        color: #fff;
      }
      .font-montserrat {
        font-family: 'Montserrat', sans-serif;
      }
      .font-codystar {
        font-family: 'Codystar', sans-serif;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 1s ease-in-out;
      }
      /* Gestion du décalage des ancres pour le menu fixe */
      section {
        scroll-margin-top: 120px;
      }
      
      /* Cacher la scrollbar tout en permettant le scroll */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Animations de panoramique partant du centre */
      @keyframes pan-right-start {
        0% { background-position: 50% 50%; }
        25% { background-position: 85% 50%; }
        75% { background-position: 15% 50%; }
        100% { background-position: 50% 50%; }
      }
      @keyframes pan-left-start {
        0% { background-position: 50% 50%; }
        25% { background-position: 15% 50%; }
        75% { background-position: 85% 50%; }
        100% { background-position: 50% 50%; }
      }
      
      .animate-pan-right {
        animation: pan-right-start 30s ease-in-out infinite;
      }
      .animate-pan-left {
        animation: pan-left-start 30s ease-in-out infinite;
      }

      /* Animation de tremblement (Shake) */
      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }
      .animate-shake {
        animation: shake 0.5s;
        animation-iteration-count: 1;
      }
    </style>
